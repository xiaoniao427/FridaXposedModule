name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # AGP 3.5 needs these pinned SDK components installed explicitly.
      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-29" "build-tools;29.0.2"

      - name: Give gradlew execute permission
        run: chmod +x gradlew

      # ponytail: offiline deps still need to resolve xposed api from jcenter/mavenCentral.
      # jcenter is dead; if resolution fails, add a maven repo/mirror for de.robv.android.xposed.
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk