name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The newer sdkmanager (cmdline-tools 16) requires JDK 17+,
      # but AGP 3.5 must build with JDK 8. Install SDK pieces under 17,
      # then build under 8.

      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # AGP 3.5 needs these pinned SDK components installed explicitly.
      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-29" "build-tools;29.0.2" "ndk;21.4.7075529"

      - name: Set up JDK 8 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Give gradlew execute permission
        run: chmod +x gradlew

      # ponytail: deps need to resolve de.robv.android.xposed from jcenter (dead) / mavenCentral.
      # If resolution fails here, point at a mirror or mavenCentral in build.gradle.
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk